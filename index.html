
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Clubs</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel=stylesheet href="style.css">
</head>

<body>
 <!-- ===== NAVBAR ===== -->
 <header class="navbar" id="navbar">
    <div class="container nav-inner">
      <a href="#" class="logo">
        <i class="fa-solid fa-graduation-cap"></i>
        <span>Student<strong>Hive</strong></span>
      </a>

      <nav class="nav-links" id="navLinks">
        <a href="#" class="active">Home</a>
        <a href="#events">Events</a>
        <a href="#clubs">Clubs</a>
        <a href="#register">Register</a>
        <a href="activties.html">Activities</a>
        <a href="#contact">Contact</a>
      </nav>

      <button class="menu-toggle" id="menuToggle" aria-label="Toggle menu" aria-expanded="false">
        <i class="fa-solid fa-bars"></i>
      </button>
    </div>
  </header>
    <div class="student">
        <h1>Student Clubs</h1>
        <p>Discover your interests. Connect with people. Join a club!</p>
    </div>

    <main class="container">

        <div class="filters">
            <input
                type="text"
                id="searchInput"
                placeholder="Search clubs by name..."
                aria-label="Search clubs by name"
            >

            <select id="categoryFilter" aria-label="Filter clubs by category">
                <option value="All">All Categories</option>
                <option value="Technology">Technology</option>
                <option value="Arts">Arts</option>
                <option value="Sports">Sports</option>
            </select>
        </div>

        <div id="message" role="status" aria-live="polite"></div>

        <div id="clubContainer"></div>

    </main>

<script src="club.js"></script>
</body>
</html>
